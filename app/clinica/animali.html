<!doctype html>
<html lang="it" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f766e">
  <title>Animali – Vetroom</title>
  <link rel="manifest" href="/app/manifest-vetroom.webmanifest">
  <link rel="apple-touch-icon" href="/app/img/vetroom-apple-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vetroom">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="../css/app.css?v=2026-10-01c">
  <script src="../vendor/supabase-2.117.2.js"></script>
  <script src="../js/config.js?v=2026-10-01c"></script>
  <script src="../js/app.js?v=2026-10-01c"></script>
  <script src="../js/i18n.js?v=2026-10-01c"></script>
  <script src="../js/layout.js?v=2026-10-01c"></script>
  <script src="../js/clinica.js?v=2026-10-01c"></script>
</head>
<body data-shell="clinic" data-nav="animali">
  <main class="wrap">
    <div class="page-head">
      <div>
        <h1>Animali</h1>
        <p class="muted" style="margin:0">Pazienti con dati completi.</p>
      </div>
      <a class="btn btn-primary" href="animale.html?nuovo=1" data-open-search="new"><img class="vr-action-icon" src="../img/icons/add_visit.png" alt="">Nuovo paziente</a>
    </div>

    <input type="search" id="q" class="search" placeholder="Cerca per nome, specie, razza, microchip o proprietario" aria-label="Cerca" hidden>
    <p class="count" id="count"></p>
    <p class="loader" id="loading">Caricamento…</p>
    <div id="msg" hidden></div>
    <ul class="rows" id="list" hidden></ul>
    <div class="empty" id="empty" hidden>
      <p><strong>Nessun animale ancora.</strong></p>
      <p class="muted">Registra il proprietario e il suo animale: ci vuole un minuto.</p>
      <a class="btn btn-primary" href="cliente.html?nuovo=1" data-open-search="new">Registra il primo paziente</a>
    </div>
  </main>

  <script>
  (async () => {
    const msg = VR.$('#msg'), loading = VR.$('#loading');
    let ctx;
    try { ctx = await VR.loadClinicContext(); } catch (e) {
      if (e.message !== 'redirect') { VR.hide(loading); VR.say(msg, VR.errorText(e), 'error'); }
      return;
    }
    let data = null, error = null;
    try {
      data = await VR.fetchAll(() => VR.sb.from('pet_access')
        .select('pet_id, client_id, pets(id, name, species, breed, birth_date, microchip, photo_path, deleted_at, owner_user_id), clients(first_name, last_name)')
        .eq('clinic_id', ctx.clinicId).eq('status', 'active').order('pet_id'));
    } catch (e) { error = e; }
    VR.hide(loading);
    if (error) { VR.say(msg, VR.errorText(error), 'error'); return; }
    const pets = (data || []).filter((a) => a.pets && !a.pets.deleted_at).map((a) => ({
      ...a.pets, owner: a.clients ? VR.clientName(a.clients) : '',
      text: [a.pets.name, a.pets.species, a.pets.breed, a.pets.microchip, a.clients?.first_name, a.clients?.last_name].filter(Boolean).join(' ').toLowerCase()
    })).sort((a, b) => a.name.localeCompare(b.name, 'it'));
    if (!pets.length) { VR.show(VR.$('#empty')); return; }

    const list = VR.$('#list'), q = VR.$('#q');
    VR.show(q); VR.show(list);
    const render = () => {
      const terms = q.value.toLowerCase().split(/\s+/).filter(Boolean);
      const shown = pets.filter((p) => terms.every((t) => p.text.includes(t)));
      VR.$('#count').textContent = terms.length ? `${shown.length} risultati su ${pets.length} animali` : (pets.length === 1 ? '1 animale' : `${pets.length} animali`);
      list.innerHTML = shown.slice(0, 300).map((p) => `
        <li><a href="animale.html?id=${p.id}">
          <div style="display:flex;gap:12px;align-items:center;min-width:0">
            <span class="avatar" aria-hidden="true">${VR.esc(VR.initials(p.name))}</span>
            <div class="main"><strong>${VR.esc(p.name)}</strong><span>${VR.esc([VR.petSubtitle(p), p.owner].filter(Boolean).join(' · ') || '—')}</span></div>
          </div>
          ${p.owner_user_id ? '<span class="chip ff-chip" title="Il proprietario usa FurrFinder">📱 FurrFinder</span>' : ''}
        </a></li>`).join('') || '<li><p class="muted" style="padding:12px 14px;margin:0">Nessun risultato.</p></li>';
    };
    q.addEventListener('input', render);
    render();
  })();
  </script>
</body>
</html>
