<!doctype html>
<html lang="it" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="robots" content="noindex">
  <title>Messaggi – Vetroom</title>
  <link rel="manifest" href="/app/manifest-vetroom.webmanifest">
  <link rel="apple-touch-icon" href="/app/img/vetroom-apple-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vetroom">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="../css/app.css?v=2026-10-07f">
  <script src="../vendor/supabase-2.117.2.js"></script>
  <script src="../js/config.js?v=2026-10-07f"></script>
  <script src="../js/app.js?v=2026-10-07f"></script>
  <script src="../js/i18n.js?v=2026-10-07f"></script>
  <script src="../js/layout.js?v=2026-10-07f"></script>
  <script src="../js/clinica.js?v=2026-10-07f"></script>
  <script src="../js/messaggi.js?v=2026-10-07f"></script>
</head>
<body data-shell="clinic" data-nav="messaggi">

  <main class="wrap msg-wrap">
    <div class="page-head">
      <div>
        <h1>Messaggi</h1>
        <p class="muted" style="margin:0">Le conversazioni con i proprietari che usano FurrFinder. Le vede tutto il team della clinica; lette e archiviate valgono solo per te.</p>
      </div>
    </div>
    <p class="loader" id="loading">Caricamento…</p>
    <div id="msg" hidden></div>
    <div class="msg-layout" id="page" hidden>
      <aside class="msg-list" id="list"></aside>
      <section class="msg-pane" id="thread"></section>
    </div>
  </main>

  <script>
  (async () => {
    const msg = VR.$('#msg'), loading = VR.$('#loading');
    let ctx;
    try { ctx = await VR.loadClinicContext(); } catch (e) {
      VR.hide(loading); if (e.message !== 'redirect') VR.say(msg, VR.errorText(e), 'error'); return;
    }
    VR.hide(loading); VR.show(VR.$('#page'));
    await VR.msg.mount({
      listEl: '#list', threadEl: '#thread', side: 'clinic', clinicId: ctx.clinicId, groupBtn: true,
      emptyHtml: '<div class="msg-empty"><p><strong>Nessun messaggio.</strong></p><p class="muted">Puoi scrivere a un proprietario dalla sua scheda, se usa FurrFinder. <a href="furrfinder.html">Come invitare i clienti</a></p></div>',
      noteHtml: 'I messaggi non sostituiscono la visita. Ricorda al proprietario di telefonare in caso di urgenza.'
    });
    const want = VR.param('c');
    if (want) VR.msg.openConversation(want).catch(() => {});
  })();
  </script>
</body>
</html>
