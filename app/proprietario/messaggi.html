<!doctype html>
<html lang="it" data-root="../">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2545">
  <meta name="robots" content="noindex">
  <title>Messaggi – FurrFinder</title>
  <link rel="manifest" href="/app/manifest-furrfinder.webmanifest">
  <link rel="apple-touch-icon" href="/app/img/furrfinder-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FurrFinder">
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="../css/app.css?v=2026-10-07e">
  <script src="../vendor/supabase-2.117.2.js"></script>
  <script src="../js/config.js?v=2026-10-07e"></script>
  <script src="../js/app.js?v=2026-10-07e"></script>
  <script src="../js/i18n.js?v=2026-10-07e"></script>
  <script src="../js/layout.js?v=2026-10-07e"></script>
  <script src="../js/clinica.js?v=2026-10-07e"></script>
  <script src="../js/proprietario.js?v=2026-10-07e"></script>
  <script src="../js/messaggi.js?v=2026-10-07e"></script>
</head>
<body data-shell="owner" data-nav="messaggi">

  <main class="wrap msg-wrap">
    <div class="page-head">
      <div>
        <h1>Messaggi</h1>
        <p class="muted" style="margin:0">Scrivi alla tua clinica veterinaria. Le conversazioni restano fra te e lei.</p>
      </div>
    </div>
    <p class="loader" id="loading">Caricamento…</p>
    <div id="msg" hidden></div>
    <div class="msg-layout" id="page" hidden>
      <aside class="msg-list" id="list"></aside>
      <section class="msg-pane" id="thread"></section>
    </div>
  </main>

  <script>
  (async () => {
    const msg = VR.$('#msg'), loading = VR.$('#loading');
    let ctx;
    try { ctx = await VR.loadOwnerContext(); } catch (e) {
      VR.hide(loading); if (e.message !== 'redirect') VR.say(msg, VR.errorText(e), 'error'); return;
    }
    VR.hide(loading); VR.show(VR.$('#page'));
    await VR.msg.mount({
      listEl: '#list', threadEl: '#thread', side: 'owner',
      emptyHtml: '<div class="msg-empty"><p><strong>Non hai ancora messaggi.</strong></p><p class="muted">Puoi scrivere alla tua clinica dalla pagina <a href="cliniche.html">Le mie cliniche</a>, se ha attivato i messaggi.</p></div>',
      noteHtml: 'Per le urgenze telefona sempre alla clinica: i messaggi possono non essere letti subito.'
    });
    const want = VR.param('c');
    if (want) VR.msg.openConversation(want).catch(() => {});
  })();
  </script>
</body>
</html>
